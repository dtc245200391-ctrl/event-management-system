services:
  event-web:
    build: ./app
    container_name: event-web
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-event_user}:${POSTGRES_PASSWORD:-change_this_password}@db:5432/${POSTGRES_DB:-event_db}
      SECRET_KEY: ${SECRET_KEY:-change_this_secret_key}
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, backend, monitoring]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
  db:
    image: postgres:16-alpine
    container_name: event-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-event_db}
      POSTGRES_USER: ${POSTGRES_USER:-event_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    restart: unless-stopped
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: event-pgadmin
    profiles: ["admin"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-change_this_admin_password}
    ports: ["127.0.0.1:5050:80"]
    networks: [backend]
    depends_on: [db]
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    container_name: event-nginx
    ports: ["8080:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [event-web]
    networks: [frontend]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: event-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus_data:/prometheus"]
    networks: [monitoring]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.3.0
    container_name: event-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change_this_grafana_password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["grafana_data:/var/lib/grafana", "./grafana/provisioning:/etc/grafana/provisioning:ro"]
    networks: [monitoring]
    depends_on: [prometheus, loki]
    restart: unless-stopped
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: event-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [monitoring]
    restart: unless-stopped
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: event-node-exporter
    command: ["--path.rootfs=/host"]
    volumes: ["/:/host:ro,rslave"]
    networks: [monitoring]
    restart: unless-stopped
  loki:
    image: grafana/loki:3.2.1
    container_name: event-loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes: ["./loki/loki-config.yml:/etc/loki/loki-config.yml:ro", "loki_data:/loki"]
    networks: [monitoring]
    restart: unless-stopped
  promtail:
    image: grafana/promtail:3.2.1
    container_name: event-promtail
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks: [monitoring]
    depends_on: [loki]
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true
  monitoring:
volumes:
  pg_data:
  prometheus_data:
  grafana_data:
  loki_data:
