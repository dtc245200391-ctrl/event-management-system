{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4">Tạo sự kiện mới</h1><form method="post"><div class="mb-3"><label class="form-label">Tên sự kiện</label><input class="form-control" name="title" required maxlength="160"></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Danh mục</label><select class="form-select" name="category"><option>Âm nhạc</option><option>Hội thảo</option><option>Giáo dục</option><option>Cộng đồng</option><option>Thể thao</option><option>Khác</option></select></div><div class="col-md-6 mb-3"><label class="form-label">Địa điểm</label><input class="form-control" name="venue" required></div></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Ngày giờ</label><input class="form-control" name="event_date" placeholder="2026-12-15 18:30" required></div><div class="col-md-3 mb-3"><label class="form-label">Giá vé (VNĐ)</label><input class="form-control" type="number" name="price" min="0" value="0" required></div><div class="col-md-3 mb-3"><label class="form-label">Sức chứa</label><input class="form-control" type="number" name="capacity" min="1" value="100" required></div></div><div class="mb-3"><label class="form-label">Mô tả</label><textarea class="form-control" name="description" rows="3"></textarea></div><button class="btn btn-primary">Lưu sự kiện</button> <a href="/" class="btn btn-outline-secondary">Hủy</a></form></div></div></div></div>{% endblock %}
