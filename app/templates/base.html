<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>E/Vent - Quản lý sự kiện</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet"></head>
<body><nav class="navbar navbar-expand-lg navbar-dark topbar"><div class="container"><a class="navbar-brand fw-bold" href="/">E/Vent</a><div><a class="btn btn-outline-light btn-sm me-2" href="/">Sự kiện</a><a class="btn btn-light btn-sm me-2" href="/events/new">+ Tạo sự kiện</a><a class="btn btn-warning btn-sm" href="/admin/registrations">Đăng ký</a></div></div></nav>
<main class="container py-4">{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, message in messages %}<div class="alert {{ 'alert-success' if category == 'success' else 'alert-danger' }}">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}{% block content %}{% endblock %}</main>
<footer class="text-center py-4 text-secondary">E/Vent · Hệ thống quản lý sự kiện · Bản thực hành học phần</footer></body></html>
